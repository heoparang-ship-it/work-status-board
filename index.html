    async function createUserFromAdmin(event) {
      event.preventDefault();
      if (!isAdmin()) return;

      const username = els.adminNewUsername.value.trim();
      const password = els.adminNewPassword.value;
      const role = els.adminNewRole.value === "admin" ? "admin" : "employee";

      if (!username || !password) {
        els.adminMessage.textContent = "아이디와 패스워드를 입력하세요.";
        return;
      }

      if (state.users.some((user) => user.username === username)) {
        els.adminMessage.textContent = "이미 사용 중인 아이디입니다.";
        return;
      }

      const user = {
        id: uid("user"),
        username,
        passwordHash: await passwordHash(password),
        characterName: username,
        role,
        status: "퇴근",
        position: POINTS.entry,
        createdAt: new Date().toISOString()
      };

      state.users.push(user);
      saveState();
      els.adminCreateForm.reset();
      els.adminNewRole.value = "employee";
      els.adminMessage.textContent = `${username} 계정을 생성했습니다.`;
      renderAdminUsers();
    }

    async function updateMasterAccount(event) {
      event.preventDefault();
      const user = currentUser();
      if (!isAdmin(user)) return;

      const username = els.masterUsername.value.trim();
      const password = els.masterPassword.value;

      if (!username || !password) {
        els.masterMessage.textContent = "마스터 아이디와 패스워드를 입력하세요.";
        return;
      }

      if (state.users.some((item) => item.id !== user.id && item.username === username)) {
        els.masterMessage.textContent = "이미 사용 중인 아이디입니다.";
        return;
      }

      user.username = username;
      user.characterName = username;
      user.passwordHash = await passwordHash(password);
      user.role = "admin";
      saveState();
      els.masterPassword.value = "";
      els.masterMessage.textContent = "마스터 계정을 변경했습니다.";
      renderAll();
      renderAdminUsers();
    }

    function monthEntries(year, monthIndex) {
      const monthPrefix = `${year}-${String(monthIndex + 1).padStart(2, "0")}-`;
      return state.attendance
        .filter((item) => typeof item.date === "string" && item.date.startsWith(monthPrefix))
        .map(normalizeAttendanceEntry)
        .filter((item) => firstClockIn(item));
    }

    function entriesForDate(date, userId = calendarFilterUserId) {
      return state.attendance
        .filter((item) => item.date === date)
        .map(normalizeAttendanceEntry)
        .filter((item) => firstClockIn(item))
        .filter((item) => userId === "all" || item.userId === userId)
        .sort((a, b) => {
          const nameA = userById(a.userId)?.username || "";
          const nameB = userById(b.userId)?.username || "";
          return nameA.localeCompare(nameB, "ko-KR");
        });
    }

    function userMonthStats(userId, year, monthIndex) {
      const entries = monthEntries(year, monthIndex).filter((entry) => entry.userId === userId);
      const outsideTotal = entries.reduce((sum, entry) => sum + (entry.outsideCount || 0), 0);
      const activeCount = entries.filter(activeSession).length;
      return { days: entries.length, outsideTotal, activeCount };
    }

    function selectedCalendarUserLabel() {
      if (calendarFilterUserId === "all") return "전체 사용자";
      return userById(calendarFilterUserId)?.username || "선택 사용자";
    }

    function renderCalendarUsers(year, monthIndex) {
      const allEntries = monthEntries(year, monthIndex);
      els.calendarUsers.innerHTML = "";

      const allCard = document.createElement("button");
      allCard.type = "button";
      allCard.className = "user-card";
      allCard.dataset.userId = "all";
      allCard.setAttribute("aria-pressed", String(calendarFilterUserId === "all"));
      allCard.innerHTML = `
        <strong>전체</strong>
        <span>${allEntries.length}건 기록</span>
        <span>사용자 ${state.users.length}명</span>
      `;
      els.calendarUsers.appendChild(allCard);

      state.users
        .slice()
        .sort((a, b) => a.username.localeCompare(b.username, "ko-KR"))
        .forEach((user) => {
          const stats = userMonthStats(user.id, year, monthIndex);
          const card = document.createElement("button");
          card.type = "button";
          card.className = "user-card";
          card.dataset.userId = user.id;
          card.setAttribute("aria-pressed", String(calendarFilterUserId === user.id));
          card.innerHTML = `
            <strong>${escapeHtml(user.username)}</strong>
            <span>출근 ${stats.days}일</span>
            <span>${stats.activeCount ? "진행 중" : `외근 ${stats.outsideTotal}회`}</span>
          `;
          els.calendarUsers.appendChild(card);
        });
    }

    function renderDayAttendance(cell, entries) {
      if (!entries.length) return;

      if (calendarFilterUserId === "all") {
        const names = entries
          .slice(0, 3)
          .map((entry) => userById(entry.userId)?.username || "알 수 없음")
          .join(", ");
        const detail = document.createElement("div");
        detail.className = "day-entry compact";
        detail.innerHTML = `
          <strong>${entries.length}명 기록</strong>
          <span>${escapeHtml(names)}</span>
        `;
        cell.appendChild(detail);

        if (entries.length > 3) {
          const more = document.createElement("div");
          more.className = "day-more";
          more.textContent = `외 ${entries.length - 3}명`;
          cell.appendChild(more);
        }
        return;
      }

      entries.forEach((entry) => {
        const owner = userById(entry.userId);
        const detail = document.createElement("div");
        detail.className = "day-entry";
        const firstIn = firstClockIn(entry);
        const latestOut = latestClockOut(entry);
        const out = activeSession(entry) ? "진행 중" : (latestOut ? timeLabel(latestOut) : "-");
        const sessionCount = entry.sessions.length > 1 ? `<span>${entry.sessions.length}회 출근</span>` : "";
        detail.innerHTML = `
          <strong>${escapeHtml(owner?.username || "알 수 없음")}</strong>
          <span>출근 ${timeLabel(firstIn)}</span>
          <span>퇴근 ${out}</span>
          ${sessionCount}
          <span>외근 ${entry.outsideCount || 0}회</span>
        `;
        cell.appendChild(detail);
      });
    }

    function renderCalendar() {
      const user = currentUser();
      if (!user) return;
      if (calendarFilterUserId !== "all" && !userById(calendarFilterUserId)) {
        calendarFilterUserId = "all";
      }

      const currentKst = kstDateParts();
      const year = currentKst.year;
      const month = currentKst.month - 1;
      const currentDateKey = todayKey();
      els.calendarTitle.textContent = `${monthTitle(year, month)} 월간 근태`;
      els.calendarSubtitle.textContent = `한국시간 기준 · ${selectedCalendarUserLabel()}`;
      els.calendarGrid.innerHTML = "";
      renderCalendarUsers(year, month);

      ["일", "월", "화", "수", "목", "금", "토"].forEach((name) => {
        const day = document.createElement("div");
        day.className = "weekday";
        day.textContent = name;
        els.calendarGrid.appendChild(day);
      });

      const firstDay = new Date(Date.UTC(year, month, 1));
      const lastDay = new Date(Date.UTC(year, month + 1, 0));
      const startOffset = firstDay.getUTCDay();
      const lastDate = lastDay.getUTCDate();
      const totalCells = Math.ceil((startOffset + lastDate) / 7) * 7;

      for (let index = 0; index < totalCells; index += 1) {
        const dayNumber = index - startOffset + 1;
        const cell = document.createElement("div");
        cell.className = "day-cell";

        if (dayNumber < 1 || dayNumber > lastDate) {
          cell.classList.add("muted");
          els.calendarGrid.appendChild(cell);
          continue;
        }

        const date = dateKeyFromParts(year, month + 1, dayNumber);
        const dayOfWeek = new Date(Date.UTC(year, month, dayNumber)).getUTCDay();
        const holiday = koreanHolidayName(date);
        const entries = entriesForDate(date);
        if (date === currentDateKey) cell.classList.add("today");
        if (dayOfWeek === 0 || dayOfWeek === 6) cell.classList.add("weekend");
        if (holiday) cell.classList.add("holiday");

        const dayNum = document.createElement("div");
        dayNum.className = "day-num";
        dayNum.innerHTML = `<span>${dayNumber}</span>${holiday ? `<span class="holiday-name">${holiday}</span>` : ""}`;
        cell.appendChild(dayNum);

        renderDayAttendance(cell, entries);
        els.calendarGrid.appendChild(cell);
      }
    }

    els.adminMenuButton.addEventListener("click", openAdminModal);
    els.closeAdmin.addEventListener("click", closeAdminModal);
    els.adminCreateForm.addEventListener("submit", createUserFromAdmin);
    els.masterAccountForm.addEventListener("submit", updateMasterAccount);
    els.saveSheetButton.addEventListener("click", saveSheetEndpoint);
    els.syncSheetButton.addEventListener("click", syncAllAttendanceToSheet);
    els.deskLayer.addEventListener("pointerdown", startDeskDrag);
    els.deskLayer.addEventListener("pointermove", moveDeskDrag);
    els.deskLayer.addEventListener("pointerup", endDeskDrag);
    els.deskLayer.addEventListener("pointercancel", endDeskDrag);
    els.deskLayer.addEventListener("dblclick", rotateDesk);
    els.calendarButton.addEventListener("click", openCalendar);
    els.calendarObject.addEventListener("click", openCalendar);
    els.closeCalendar.addEventListener("click", closeCalendar);
    els.calendarModal.addEventListener("click", (event) => {
      if (event.target === els.calendarModal) closeCalendar();
    });
    els.adminModal.addEventListener("click", (event) => {
      if (event.target === els.adminModal) closeAdminModal();
    });
    els.calendarUsers.addEventListener("click", (event) => {
      const card = event.target.closest(".user-card");
      if (!card) return;
      calendarFilterUserId = card.dataset.userId || "all";
      renderCalendar();
    });
    els.clockOutButton.addEventListener("click", clockOut);
    els.logoutButton.addEventListener("click", logout);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeCommandMenu();
        closeCalendar();
        closeAdminModal();
        if (deskEditMode) toggleDeskEditMode(false);
        return;
      }

      const isDashboardOpen = !els.dashboard.classList.contains("hidden");
      const isCalendarOpen = els.calendarModal.classList.contains("open");
      const isTyping = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName);
      const vector = keyboardVector(event);

      if (isDashboardOpen && !isCalendarOpen && !isTyping && vector) {
        event.preventDefault();
        closeCommandMenu();
        moveCharacterBy(vector[0], vector[1]);
      }
    });

    async function initApp() {
      if (sheetEndpoint()) {
        await fetchRemoteState();
      }
      await ensureMasterAccount({ save: true });
      startRemoteStatePolling();
      if (state.session && currentUser()) {
        enterDashboard();
      } else {
        showAuth();
      }
    }

    initApp();
  </script>
</body>
</html>
